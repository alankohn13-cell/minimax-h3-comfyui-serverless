name: build-minimax-h3-image
on:
  push:
    paths: ['Dockerfile', '.github/workflows/build.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      # 42.5GB of weights + base image layers blow past the default runner disk.
      # Merge / and /mnt into one LVM volume (~110GB) and put docker's data-root on it.
      - name: Stop docker before remounting its data-root
        run: sudo systemctl stop docker docker.socket
      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 4096
          swap-size-mb: 128
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          build-mount-path: /var/lib/docker
          build-mount-path-ownership: 'root:root'
      - name: Start docker on the big volume
        run: sudo systemctl start docker
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/vincezh2000/minimax-h3-comfyui-serverless:latest
          provenance: false
