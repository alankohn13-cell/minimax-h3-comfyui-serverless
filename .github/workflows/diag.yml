name: diag-kitchen-import
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify torch cu130 and kitchen backends in the code image
        run: |
          docker run --rm -w /comfyui ghcr.io/vincezh2000/minimax-h3-comfyui-serverless:code /comfyui/.venv/bin/python -c "
          import sys; sys.path.insert(0, '/comfyui')
          import torch
          print('torch:', torch.__version__, 'cuda:', torch.version.cuda)
          import comfy_kitchen as ck
          print('kitchen backends:', ck.list_backends())
          import comfy.quant_ops as q
          print('CK available:', q._CK_AVAILABLE)
          from comfy.quant_ops import get_layout_class, QUANT_ALGOS
          for fmt, conf in QUANT_ALGOS.items():
              print(fmt, '->', conf['comfy_tensor_layout'], '->', get_layout_class(conf['comfy_tensor_layout']))
          "
